<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gunblood Western Shootout</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
    }
    #player-container {
      width: 100%;
      height: 100%;
      max-width: 880px;
      max-height: 520px;
      position: relative;
    }
    ruffle-embed, ruffle-player {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div id="player-container"></div>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.addEventListener("DOMContentLoaded", () => {
      try {
        const ruffle = window.RufflePlayer.newest();
        if (ruffle) {
          const player = ruffle.createPlayer();
          const container = document.getElementById("player-container");
          container.appendChild(player);
          player.load({
            url: "https://www.gunblood.com/play/gunblood-western-shootout.swf?gin=LA%20BSK",
            parameters: "quality=high",
            allowScriptAccess: true
          }).catch(() => {
            // Unblocked HTML5 fallback if direct SWF CORS header is restricted
            window.location.replace("https://unblockedgames76.gitlab.io/gunblood/");
          });
        } else {
          window.location.replace("https://unblockedgames76.gitlab.io/gunblood/");
        }
      } catch (e) {
        window.location.replace("https://unblockedgames76.gitlab.io/gunblood/");
      }
    });
  </script>
</body>
</html>
